name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12.7'

    - name: Validate versions
      run: |
        # Per-package: __init__ __version__ must match the pyproject version.
        # Cross-package versions are NOT required to match — packages release
        # independently and gh-action-pypi-publish skips already-published ones.
        # The git tag must match at least one package (so a tag maps to a release).
        python - "$GITHUB_REF" <<'PY'
        import re, sys, tomllib, pathlib

        tag = sys.argv[1].removeprefix("refs/tags/v").split("-", 1)[0]
        pkgs = {
            "deepfreeze-core":   "deepfreeze_core",
            "deepfreeze-cli":    "deepfreeze",
            "deepfreeze-server": "deepfreeze_server",
        }
        problems, versions = [], {}
        for dist, mod in pkgs.items():
            root = pathlib.Path("packages") / dist
            proj = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
            init = re.search(r'__version__ = "([^"]+)"',
                             (root / mod / "__init__.py").read_text()).group(1)
            versions[dist] = proj
            marker = "" if proj == init else f"  <-- __init__ says {init}"
            print(f"{dist:20} pyproject={proj} init={init}{marker}")
            if proj != init:
                problems.append(f"{dist}: pyproject {proj} != __init__ {init}")

        print(f"\ntag = {tag}")
        if tag not in versions.values():
            problems.append(f"tag v{tag} matches no package version {sorted(set(versions.values()))}")

        will_publish = [d for d, v in versions.items() if v == tag]
        print("packages at tag version (will publish if new):", will_publish or "none")

        if problems:
            print("\nERROR:")
            for p in problems:
                print("  -", p)
            sys.exit(1)
        print("\nversion checks passed")
        PY

  build:
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12.7'

    - name: Build sdists and wheels for all packages
      run: |
        python -m pip install --upgrade build
        for pkg in deepfreeze-core deepfreeze-cli deepfreeze-server; do
          echo "::group::build $pkg"
          python -m build --outdir dist "packages/$pkg"
          echo "::endgroup::"
        done
        ls -l dist

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # Publishes deepfreeze-core, deepfreeze-cli and deepfreeze-server to PyPI via
  # Trusted Publishing (OIDC). Each PyPI project must have a trusted publisher
  # configured for: repo elastic/deepfreeze, workflow release.yml, environment pypi.
  # No API tokens are stored — the upload is authorized by GitHub's OIDC identity.
  # skip-existing lets unchanged packages ride along harmlessly: any (name, version)
  # already on PyPI is skipped rather than failing the run.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepfreeze-core/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
